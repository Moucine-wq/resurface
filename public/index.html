    #authScreen{min-height:100vh;display:grid;place-items:center;padding:22px}.auth-shell{width:min(960px,100%);display:grid;grid-template-columns:1.05fr .8fr;background:rgba(255,255,255,.9);border:1px solid rgba(216,229,223,.9);border-radius:30px;overflow:hidden;box-shadow:var(--shadow);backdrop-filter:blur(12px)}.auth-story{padding:54px;background:linear-gradient(145deg,#073d2d,#0a7254);color:white;display:flex;flex-direction:column;justify-content:space-between;min-height:610px}.auth-story .brand small{color:#b9e6d5}.auth-copy h1{font-size:clamp(38px,6vw,68px);line-height:.96;letter-spacing:-.055em;margin:36px 0 18px;max-width:620px}.auth-copy p{font-size:18px;line-height:1.65;color:#d3efe4;max-width:580px}.preview{margin-top:34px;background:rgba(255,255,255,.11);border:1px solid rgba(255,255,255,.16);border-radius:20px;padding:18px}.preview-row{display:flex;gap:12px;align-items:center;padding:11px 0;border-bottom:1px solid rgba(255,255,255,.12)}.preview-row:last-child{border:0}.preview-time{font-weight:900;color:#6ff0bd}.auth-panel{padding:34px;display:flex;flex-direction:column}.auth-top{display:flex;justify-content:flex-end;gap:8px}.auth-panel h2{font-size:29px;letter-spacing:-.035em;margin:44px 0 8px}.auth-panel>p{color:var(--muted);line-height:1.55;margin:0 0 24px}.segmented{display:grid;grid-template-columns:1fr 1fr;background:#edf3f0;padding:4px;border-radius:14px;margin-bottom:20px}.segmented button{border:0;background:transparent;padding:10px;border-radius:11px;font-weight:800;color:var(--muted)}.segmented button.active{background:#fff;color:var(--ink);box-shadow:0 3px 10px rgba(20,54,42,.08)}.form-stack{display:grid;gap:13px}.form-stack label{font-size:13px;font-weight:800}.form-stack .field{width:100%;margin-top:6px}.form-error{min-height:20px;color:var(--danger);font-size:13px}.auth-foot{margin-top:auto;padding-top:22px;color:var(--muted);font-size:12px;line-height:1.5}

<body>
  <section id="authScreen">
    <div class="auth-shell">
      <div class="auth-story">
        <div class="brand"><span class="brand-mark"><svg viewBox="0 0 24 24" fill="none"><path d="M4 14h16M7 14c0-5 2.7-9 5-9s5 4 5 9" stroke="#6ff0bd" stroke-width="2.4" stroke-linecap="round"/></svg></span><div>Resurface<small data-i18n="signature"></small></div></div>
        <div class="auth-copy"><span class="beta" data-i18n="beta_free"></span><h1 data-i18n="welcome_title"></h1><p data-i18n="welcome_sub"></p>
          <div class="preview"><div class="preview-row"><span class="preview-time">09:00</span><span data-i18n="sample_one"></span></div><div class="preview-row"><span class="preview-time">14:30</span><span data-i18n="sample_two"></span></div><div class="preview-row"><span class="preview-time">18:00</span><span data-i18n="sample_three"></span></div></div>
        </div>
        <small data-i18n="pwa_note"></small>
      </div>
      <div class="auth-panel">
        <div class="auth-top"><select id="authLanguage" class="select" aria-label="Language"><option value="fr">FR</option><option value="en">EN</option><option value="es">ES</option><option value="pt">PT</option></select><button id="authInstall" class="btn hidden" data-i18n="install"></button></div>
        <h2 id="authTitle"></h2><p data-i18n="auth_sub"></p>
        <div class="segmented"><button id="signupTab" class="active" data-i18n="create_account"></button><button id="loginTab" data-i18n="login"></button></div>
        <form id="authForm" class="form-stack">
          <label><span data-i18n="email"></span><input id="email" class="field" type="email" autocomplete="email" required></label>
          <label><span data-i18n="password"></span><input id="password" class="field" type="password" minlength="8" autocomplete="new-password" required></label>
          <div id="authError" class="form-error" role="alert"></div>
          <button id="authSubmit" class="btn btn-primary" type="submit"></button>
        </form>
        <div class="auth-foot" data-i18n="privacy_auth"></div>
      </div>
    </div>
  </section>

  <section id="appShell" class="hidden">
    <header class="topbar"><div class="topbar-inner"><div class="brand"><span class="brand-mark"><svg viewBox="0 0 24 24" fill="none"><path d="M4 14h16M7 14c0-5 2.7-9 5-9s5 4 5 9" stroke="#6ff0bd" stroke-width="2.4" stroke-linecap="round"/></svg></span><div>Resurface<small data-i18n="signature"></small></div></div><div class="top-actions"><span class="beta" data-i18n="beta_free"></span><button id="appInstall" class="btn hidden"><span class="install-label" data-i18n="install"></span> ↓</button><select id="appLanguage" class="select" aria-label="Language"><option value="fr">FR</option><option value="en">EN</option><option value="es">ES</option><option value="pt">PT</option></select><button id="profileButton" class="avatar" aria-label="Settings">M</button></div></div></header>
    <div class="app-layout">
      <nav class="side-nav" aria-label="Main navigation">
        <button class="nav-btn active" data-view="today"><span class="nav-icon">◉</span><span data-i18n="today"></span></button>
        <button class="nav-btn" data-view="upcoming"><span class="nav-icon">↗</span><span data-i18n="upcoming"></span></button>
        <button class="nav-btn" data-view="completed"><span class="nav-icon">✓</span><span data-i18n="completed"></span></button>
        <button class="nav-btn" data-view="settings"><span class="nav-icon">⚙</span><span data-i18n="settings"></span></button>
      </nav>
      <main class="main">
        <section class="view" id="todayView">
          <div class="view-head"><div><h1 data-i18n="today_title"></h1><p id="todaySubtitle"></p></div><button class="btn btn-primary open-capture" data-i18n="new_item"></button></div>
          <div class="summary"><div class="summary-card"><strong id="summaryToday">0</strong><span data-i18n="due_today"></span></div><div class="summary-card"><strong id="summaryUpcoming">0</strong><span data-i18n="scheduled"></span></div><div class="summary-card"><strong id="summaryDone">0</strong><span data-i18n="finished"></span></div></div>
          <div class="panel"><div class="panel-title"><h2 data-i18n="digest_title"></h2><span class="count" id="todayCount">0</span></div><div class="list" id="todayList"></div></div>
        </section>
        <section class="view hidden" id="upcomingView"><div class="view-head"><div><h1 data-i18n="upcoming_title"></h1><p data-i18n="upcoming_sub"></p></div><button class="btn btn-primary open-capture" data-i18n="new_item"></button></div><div class="panel"><div class="panel-title"><h2 data-i18n="all_scheduled"></h2><span class="count" id="upcomingCount">0</span></div><div class="list" id="upcomingList"></div></div></section>
        <section class="view hidden" id="completedView"><div class="view-head"><div><h1 data-i18n="completed_title"></h1><p data-i18n="completed_sub"></p></div></div><div class="panel"><div class="panel-title"><h2 data-i18n="history"></h2><span class="count" id="doneCount">0</span></div><div class="list" id="doneList"></div></div></section>
        <section class="view hidden" id="settingsView"><div class="view-head"><div><h1 data-i18n="settings"></h1><p data-i18n="settings_sub"></p></div></div><div class="settings-grid">
          <div class="settings-section"><h2 data-i18n="automatic_context"></h2><p data-i18n="automatic_context_sub"></p>
            <div class="setting-row"><div><label for="timezone" data-i18n="timezone"></label><small id="deviceTimezone"></small></div><select id="timezone" class="select"></select></div>
            <div class="setting-row"><div><label for="country" data-i18n="country"></label><small data-i18n="country_help"></small></div><select id="country" class="select"></select></div>
            <div class="setting-row"><div><label data-i18n="auto_detect"></label><small data-i18n="auto_detect_help"></small></div><button id="autoDetect" class="btn btn-soft" data-i18n="use_device"></button></div>
          </div>
          <div class="settings-section"><h2 data-i18n="currency_pricing"></h2><p data-i18n="currency_pricing_sub"></p>
            <div class="setting-row"><div><label for="currency" data-i18n="currency"></label><small data-i18n="currency_help"></small></div><select id="currency" class="select"></select></div>
            <div class="setting-row"><div><label data-i18n="currency_auto"></label><small data-i18n="currency_auto_help"></small></div><button id="currencyAuto" class="btn btn-soft" data-i18n="adapt_country"></button></div>
            <div class="price-preview"><strong id="pricePreviewAmount">9 €</strong><span id="pricePreviewPeriod" data-i18n="per_month"></span><span class="free-note" data-i18n="beta_stays_free"></span></div>
          </div>
          <div class="settings-section"><h2 data-i18n="digest_settings"></h2><p data-i18n="digest_settings_sub"></p>
            <div class="setting-row"><div><label for="digestTime" data-i18n="digest_time"></label><small data-i18n="digest_time_help"></small></div><input id="digestTime" class="field" type="time"></div>
            <div class="setting-row"><div><label for="digestEnabled" data-i18n="email_digest"></label><small data-i18n="email_digest_help"></small></div><div class="switch"><input id="digestEnabled" type="checkbox"><span id="digestStatus"></span></div></div>
          </div>
          <div class="settings-section"><h2 data-i18n="privacy_location"></h2><p data-i18n="privacy_location_sub"></p><div class="privacy-note" data-i18n="location_note"></div><div style="margin-top:12px"><button id="gpsButton" class="btn" data-i18n="check_gps"></button><div id="gpsResult" class="gps-result"></div></div></div>
          <div class="settings-section"><h2 data-i18n="account"></h2><p id="accountEmail"></p><button id="logout" class="btn btn-danger" data-i18n="logout"></button></div>
        </div></section>
      </main>
    </div>
    <button class="fab open-capture" aria-label="Add">+</button>
    <nav class="bottom-nav" aria-label="Mobile navigation"><button class="nav-btn active" data-view="today"><span class="nav-icon">◉</span><span data-i18n="today"></span></button><button class="nav-btn" data-view="upcoming"><span class="nav-icon">↗</span><span data-i18n="upcoming"></span></button><button class="nav-btn" data-view="completed"><span class="nav-icon">✓</span><span data-i18n="completed"></span></button><button class="nav-btn" data-view="settings"><span class="nav-icon">⚙</span><span data-i18n="settings"></span></button></nav>
  </section>

  <div class="overlay" id="captureOverlay" role="dialog" aria-modal="true"><div class="dialog"><button class="close" data-close="captureOverlay" aria-label="Close">×</button><h2 data-i18n="capture_title"></h2><p class="dialog-sub" data-i18n="capture_sub"></p><form id="captureForm" class="capture-form">

    <div class="date-time"><label><span data-i18n="date"></span><input id="resurfaceDate" class="field" type="date" required></label><label><span data-i18n="time"></span><input id="resurfaceTime" class="field" type="time" required value="09:00"></label></div>
    <small id="timezoneHint"></small>
    <details class="details"><summary data-i18n="optional_options"></summary><div class="detail-grid">
      <label><span data-i18n="category"></span><select id="category" class="select"></select><small id="categoryHelp" class="choice-help"></small></label>
      <label><span data-i18n="recurrence"></span><select id="recurring" class="select"></select><small id="recurrenceHelp" class="choice-help"></small></label>
      <label id="customRecurrenceWrap" class="conditional hidden"><span data-i18n="custom_interval"></span><input id="recurrenceInterval" class="field" type="number" min="1" max="3650" value="10"><small class="choice-help" data-i18n="custom_interval_help"></small></label>
      <div class="inline-note conditional" data-i18n="options_explainer"></div>
    </div></details>
    <div id="captureError" class="form-error" role="alert"></div><div class="dialog-actions"><button type="button" class="btn" data-close="captureOverlay" data-i18n="cancel"></button><button id="saveItem" class="btn btn-primary" type="submit" data-i18n="schedule"></button></div>
  </form></div></div>

  <div class="overlay" id="snoozeOverlay" role="dialog" aria-modal="true"><div class="dialog"><button class="close" data-close="snoozeOverlay">×</button><h2 data-i18n="snooze_title"></h2><p class="dialog-sub" data-i18n="snooze_sub"></p><form id="snoozeForm" class="capture-form"><div class="quick-dates"><button type="button" class="snooze-quick quick" data-days="1" data-i18n="tomorrow"></button><button type="button" class="snooze-quick quick active" data-days="7" data-i18n="next_week"></button><button type="button" class="snooze-quick quick" data-days="30" data-i18n="one_month"></button><button type="button" class="snooze-quick quick" data-days="custom" data-i18n="custom"></button></div><div class="date-time"><label><span data-i18n="date"></span><input id="snoozeDate" class="field" type="date" required></label><label><span data-i18n="time"></span><input id="snoozeTime" class="field" type="time" required></label></div><div class="dialog-actions"><button type="button" class="btn" data-close="snoozeOverlay" data-i18n="cancel"></button><button class="btn btn-primary" type="submit" data-i18n="snooze"></button></div></form></div></div>

  <div class="overlay" id="editOverlay" role="dialog" aria-modal="true"><div class="dialog"><button class="close" data-close="editOverlay">×</button><h2 data-i18n="edit_title"></h2><form id="editForm" class="capture-form"><label><span data-i18n="what_resurface"></span><textarea id="editText" class="field" maxlength="500" required></textarea></label><div class="date-time"><label><span data-i18n="date"></span><input id="editDate" class="field" type="date" required></label><label><span data-i18n="time"></span><input id="editTime" class="field" type="time" required></label></div><div class="detail-grid"><label><span data-i18n="category"></span><select id="editCategory" class="select"></select><small id="editCategoryHelp" class="choice-help"></small></label><label><span data-i18n="recurrence"></span><select id="editRecurring" class="select"></select><small id="editRecurrenceHelp" class="choice-help"></small></label><label id="editCustomRecurrenceWrap" class="conditional hidden"><span data-i18n="custom_interval"></span><input id="editRecurrenceInterval" class="field" type="number" min="1" max="3650" value="10"><small class="choice-help" data-i18n="custom_interval_help"></small></label></div><div class="dialog-actions"><button type="button" class="btn" data-close="editOverlay" data-i18n="cancel"></button><button class="btn btn-primary" type="submit" data-i18n="save"></button></div></form></div></div>

  <div id="toast" class="toast hidden" role="status"></div>
  <script src="/app.js" defer></script>
</body>
</html>
