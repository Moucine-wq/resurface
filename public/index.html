const locales=['fr','en','es','pt']; let locale=localStorage.getItem('resurface_locale')||((navigator.language||'fr').slice(0,2));if(!locales.includes(locale))locale='fr';let token=localStorage.getItem('resurface_token');let isPremium=false,isSignup=true,selectedDays=7;
const prices={EUR:{amount:9,symbol:'€',locale:'fr-FR'},USD:{amount:9,symbol:'$',locale:'en-US'},GBP:{amount:8,symbol:'£',locale:'en-GB'},CAD:{amount:12,symbol:'CA$',locale:'en-CA'},BRL:{amount:29.9,symbol:'R$',locale:'pt-BR'}};
function detectCurrency(){const stored=localStorage.getItem('resurface_currency');if(prices[stored])return stored;const r=(navigator.language||'').toUpperCase();if(r.includes('BR'))return'BRL';if(r.includes('CA'))return'CAD';if(r.includes('GB'))return'GBP';if(r.includes('US'))return'USD';return'EUR'}let currency=detectCurrency();
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)],tr=k=>translations[locale][k]??translations.en[k]??k;
function applyI18n(){document.documentElement.lang=locale;$$('[data-i18n]').forEach(e=>e.textContent=tr(e.dataset.i18n));$('#language').value=locale;$('#appLanguage').value=locale;$('#authTitle').textContent=isSignup?tr('signup_title'):tr('login_title');$('#authSubmit').textContent=isSignup?tr('signup_btn'):tr('login_btn');$('#switchText').textContent=isSignup?tr('have_account'):tr('no_account');$('#switchMode').textContent=isSignup?tr('log_in'):tr('create_one');$('#itemText').placeholder=locale==='fr'?'Exemple : Relancer David dans deux semaines':'Example: Follow up with David in two weeks';updatePrices();}
function formatPrice(code){const p=prices[code];return new Intl.NumberFormat(p.locale,{style:'currency',currency:code,maximumFractionDigits:p.amount%1?2:0}).format(p.amount)}function updatePrices(){const txt=`${formatPrice(currency)} <small>${tr('per_month')}</small>`;$('#marketingPrice').innerHTML=txt;$('#modalPrice').innerHTML=txt;$('#currency').value=currency;localStorage.setItem('resurface_currency',currency)}
function open(id){$(id).classList.add('open')}function close(id){$(id).classList.remove('open')}function showToast(msg){const e=$('#toast');e.textContent=msg;e.classList.remove('hidden');setTimeout(()=>e.classList.add('hidden'),2600)}
function openAuth(signup=true){isSignup=signup;applyI18n();$('#authError').textContent='';open('#authOverlay');setTimeout(()=>$('#email').focus(),50)}
['#startTop','#heroStart','#freeStart','#proStart','#ctaStart'].forEach(id=>$(id).onclick=()=>openAuth(true));$('#loginTop').onclick=()=>openAuth(false);$$('[data-close]').forEach(b=>b.onclick=()=>close('#'+b.dataset.close+'Overlay'));$$('.overlay').forEach(o=>o.addEventListener('click',e=>{if(e.target===o)o.classList.remove('open')}));document.addEventListener('keydown',e=>{if(e.key==='Escape')$$('.overlay.open').forEach(x=>x.classList.remove('open'))});
$('#switchMode').onclick=e=>{e.preventDefault();isSignup=!isSignup;applyI18n()};
async function request(path,opts={}){try{const r=await fetch(API+path,{...opts,headers:{'Content-Type':'application/json',...(token?{Authorization:`Bearer ${token}`}:{}) ,...(opts.headers||{})}});let d={};try{d=await r.json()}catch{}if(r.status===401&&token){logout();throw new Error(tr('session_expired'))}if(!r.ok){const er=new Error(d.error||'Error');er.code=d.code;throw er}return d}catch(e){if(e instanceof TypeError)throw new Error(tr('network_error'));throw e}}
$('#authForm').onsubmit=async e=>{e.preventDefault();const btn=$('#authSubmit');btn.disabled=true;$('#authError').textContent='';try{const d=await request(isSignup?'/signup':'/login',{method:'POST',body:JSON.stringify({email:$('#email').value.trim(),password:$('#password').value,locale})});token=d.token;localStorage.setItem('resurface_token',token);close('#authOverlay');showApp()}catch(err){$('#authError').textContent=err.message}finally{btn.disabled=false}};
function logout(){token=null;localStorage.removeItem('resurface_token');$('#appShell').classList.add('hidden');$('#marketing').classList.remove('hidden')}$('#logout').onclick=logout;
async function showApp(){if(!token)return;$('#marketing').classList.add('hidden');$('#appShell').classList.remove('hidden');applyI18n();try{const me=await request('/me');isPremium=me.isPremium;refreshPlan();await loadItems();const q=new URLSearchParams(location.search);if(q.get('checkout')==='success')showToast(locale==='fr'?'Paiement confirmé. Activation en cours…':'Payment confirmed. Activating…');history.replaceState({},'',location.pathname)}catch(e){console.error(e)}}
function refreshPlan(){$('#planBadge').textContent=isPremium?tr('plan_premium'):tr('plan_free');$('#billingBtn').classList.toggle('hidden',!isPremium);$('#category').disabled=!isPremium;$('#recurring').disabled=!isPremium}
$('#upgrade').onclick=()=>open('#payOverlay');$('#planBadge').onclick=()=>{if(!isPremium)open('#payOverlay')};$('#currency').onchange=e=>{currency=e.target.value;updatePrices()};$('#checkout').onclick=async()=>{const b=$('#checkout');b.disabled=true;$('#payError').textContent='';try{const d=await request('/stripe/create-checkout-session',{method:'POST',body:JSON.stringify({currency})});location.href=d.url}catch(e){$('#payError').textContent=e.message}finally{b.disabled=false}};$('#billingBtn').onclick=async()=>{try{const d=await request('/stripe/create-portal-session',{method:'POST'});location.href=d.url}catch(e){showToast(e.message)}};
$$('.quick').forEach(b=>b.onclick=()=>{$$('.quick').forEach(x=>x.classList.remove('active'));b.classList.add('active');selectedDays=b.dataset.days;$('#customDate').classList.toggle('hidden',selectedDays!=='custom');if(selectedDays==='custom')$('#customDate').focus()});
$('#addBtn').onclick=addItem;$('#itemText').onkeydown=e=>{if(e.key==='Enter')addItem()};async function addItem(){const text=$('#itemText').value.trim();if(!text)return $('#itemText').focus();let date;if(selectedDays==='custom'){date=$('#customDate').value;if(!date)return $('#customDate').focus()}else{const d=new Date();d.setDate(d.getDate()+Number(selectedDays));date=d.toISOString().slice(0,10)}const b=$('#addBtn');b.disabled=true;try{await request('/items',{method:'POST',body:JSON.stringify({text,resurfaceAt:date,category:isPremium?$('#category').value:'',recurringDays:isPremium?$('#recurring').value:''})});$('#itemText').value='';showToast(`${tr('saved')} ${fmt(date)}`);await loadItems()}catch(e){if(e.code==='LIMIT_REACHED')open('#payOverlay');else showToast(e.message)}finally{b.disabled=false}}
function fmt(s){return new Date(s+'T12:00:00').toLocaleDateString(locale,{day:'numeric',month:'short',year:'numeric'})}function itemEl(item,context){const el=document.createElement('div');el.className='item '+(item.status==='done'?'done':'');const check=document.createElement('button');check.className='check';check.setAttribute('aria-label',tr('done'));check.onclick=async()=>{await request('/items/'+item.id,{method:'PATCH',body:JSON.stringify({action:item.status==='done'?'reopen':'done'})});showToast(tr('marked_done'));loadItems()};const body=document.createElement('div');body.className='item-body';const txt=document.createElement('div');txt.className='item-text';txt.textContent=item.text;const meta=document.createElement('div');meta.className='item-meta';meta.textContent=(context==='done'&&item.completedAt?fmt(item.completedAt.slice(0,10)):fmt(item.resurfaceAt))+(item.category?' · '+item.category:'')+(item.recurringDays?' · ↻':'');body.append(txt,meta);const acts=document.createElement('div');acts.className='item-actions';if(context!=='done'){const s=document.createElement('button');s.textContent=tr('snooze');s.onclick=async()=>{await request('/items/'+item.id,{method:'PATCH',body:JSON.stringify({action:'snooze',days:7})});showToast(tr('snoozed'));loadItems()};acts.append(s)}const del=document.createElement('button');del.textContent='×';del.setAttribute('aria-label','Delete');del.onclick=async()=>{if(!confirm(tr('confirm_delete')))return;await request('/items/'+item.id,{method:'DELETE'});showToast(tr('deleted'));loadItems()};acts.append(del);el.append(check,body,acts);return el}
function render(id,count,items,context){$(count).textContent=items.length;const box=$(id);box.innerHTML='';if(!items.length){const e=document.createElement('div');e.className='empty';e.textContent=tr(context==='today'?'empty_today':context==='upcoming'?'empty_upcoming':'empty_done');box.append(e)}else items.forEach(x=>box.append(itemEl(x,context)))}async function loadItems(){try{const d=await request('/items');isPremium=d.isPremium;refreshPlan();render('#todayList','#todayCount',d.today,'today');render('#upcomingList','#upcomingCount',d.upcoming,'upcoming');render('#doneList','#doneCount',d.done,'done');const n=d.today.length+d.upcoming.length;$('#usage').textContent=isPremium?`${n} ${locale==='fr'?'rappels actifs — illimités': 'active reminders — unlimited'}`:`${n} / ${d.freeLimit} ${locale==='fr'?'rappels actifs': 'active reminders'}`;$('#upgrade').classList.toggle('hidden',isPremium)}catch(e){showToast(e.message)}}
$('#language').onchange=$('#appLanguage').onchange=async e=>{locale=e.target.value;localStorage.setItem('resurface_locale',locale);applyI18n();if(token)try{await request('/me',{method:'PATCH',body:JSON.stringify({locale})});loadItems()}catch{}};
$$('[data-legal]').forEach(a=>a.onclick=e=>{e.preventDefault();const type=a.dataset.legal;$('#legalTitle').textContent=tr(type+'_title');$('#legalBody').textContent=tr(type+'_body');open('#legalOverlay')});
async function loadPublicConfig(){try{const r=await fetch(API+'/config');const cfg=await r.json();$$('#currency option').forEach(o=>{const available=cfg.currencies?.[o.value]?.checkoutEnabled;o.disabled=!available;o.textContent+=(available?'':' — à configurer');});if(!cfg.currencies?.[currency]?.checkoutEnabled){const first=$$('#currency option').find(o=>!o.disabled);if(first){currency=first.value;updatePrices();}}}catch(e){console.warn('Pricing config unavailable',e)}}
applyI18n();loadPublicConfig();if(token)showApp();
</script></body></html>
