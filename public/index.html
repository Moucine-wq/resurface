<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Resurface</title>
<style>
  :root {
    --bg: #0A0A0F; --card: #14141c; --border: #24242e;
    --mint: #4DFFC3; --gold: #FFC94D; --text: #EDEDF2; --muted: #8A8A99;
    --danger: #ff6b6b;
    --font: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--bg); color: var(--text); font-family: var(--font); min-height: 100vh; }
  .hidden { display: none !important; }

  #auth { display: flex; align-items: center; justify-content: center; min-height: 100vh; padding: 20px; }
  .auth-box { background: var(--card); border: 1px solid var(--border); border-radius: 16px; padding: 40px; width: 100%; max-width: 380px; position: relative; }
  .auth-box h1 { font-size: 24px; margin-bottom: 6px; }
  .auth-box .tagline { color: var(--muted); font-size: 14px; margin-bottom: 28px; }
  input { width: 100%; background: #1c1c26; border: 1px solid var(--border); border-radius: 8px; padding: 12px 14px; color: var(--text); font-size: 14px; margin-bottom: 12px; font-family: var(--font); }
  input:focus { outline: none; border-color: var(--mint); }
  button { cursor: pointer; font-family: var(--font); border: none; border-radius: 8px; }
  select { font-family: var(--font); }
  .btn-primary { width: 100%; background: var(--mint); color: #0A0A0F; font-weight: 600; padding: 12px; font-size: 14px; margin-top: 6px; }
  .btn-primary:hover { opacity: 0.9; }
  .switch-link { text-align: center; margin-top: 16px; font-size: 13px; color: var(--muted); }
  .switch-link a { color: var(--mint); cursor: pointer; text-decoration: none; }
  .auth-error { color: var(--danger); font-size: 13px; margin-bottom: 10px; min-height: 16px; }

  .lang-switch {
    position: absolute; top: 16px; right: 16px;
    background: #1c1c26; border: 1px solid var(--border); border-radius: 8px;
    color: var(--muted); font-size: 12px; padding: 6px 8px;
  }

  #app { max-width: 640px; margin: 0 auto; padding: 24px 20px 80px; }
  header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 24px; gap: 12px; }
  header .logo { font-size: 18px; font-weight: 700; letter-spacing: -0.02em; }
  header .logo span { color: var(--mint); }
  header .tagline { color: var(--muted); font-size: 12px; margin-top: 2px; }
  .header-right { display: flex; align-items: center; gap: 8px; }
  .plan-badge { font-size: 11px; font-weight: 600; padding: 5px 10px; border-radius: 20px; white-space: nowrap; cursor: pointer; border: 1px solid var(--border); }
  .plan-badge.free { color: var(--muted); background: transparent; }
  .plan-badge.premium { color: #0A0A0F; background: var(--gold); border-color: var(--gold); }
  #logoutBtn { background: transparent; color: var(--muted); font-size: 13px; padding: 6px 10px; }
  #logoutBtn:hover { color: var(--text); }
  #langSelect {
    background: #1c1c26; border: 1px solid var(--border); border-radius: 8px;
    color: var(--muted); font-size: 12px; padding: 6px 8px;
  }

  .banner { border-radius: 10px; padding: 12px 14px; margin-bottom: 20px; font-size: 13px; }
  .banner.success { background: rgba(77,255,195,0.1); border: 1px solid var(--mint); color: var(--mint); }
  .banner.info { background: rgba(255,201,77,0.1); border: 1px solid var(--gold); color: var(--gold); }

  .capture-box { background: var(--card); border: 1px solid var(--border); border-radius: 14px; padding: 16px; margin-bottom: 20px; }
  .capture-box input[type=text] { margin-bottom: 10px; }
  .capture-row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .capture-row select, .capture-row input[type=date] { background: #1c1c26; border: 1px solid var(--border); border-radius: 8px; padding: 10px; color: var(--text); font-size: 13px; font-family: var(--font); }
  select:disabled { opacity: 0.4; cursor: not-allowed; }
  .capture-row button.add-btn { background: var(--mint); color: #0A0A0F; font-weight: 600; padding: 10px 18px; font-size: 13px; margin-left: auto; }

  .usage-bar { background: var(--card); border: 1px solid var(--border); border-radius: 10px; padding: 10px 14px; margin-bottom: 24px; font-size: 12px; color: var(--muted); display: flex; justify-content: space-between; align-items: center; }
  .usage-bar .upgrade-link { color: var(--mint); cursor: pointer; font-weight: 600; }

  section.group { margin-bottom: 28px; }
  section.group h2 { font-size: 13px; text-transform: uppercase; letter-spacing: 0.06em; color: var(--muted); margin-bottom: 10px; display: flex; align-items: center; gap: 8px; }
  section.group h2 .count { background: var(--border); color: var(--text); font-size: 11px; padding: 1px 7px; border-radius: 10px; }
  section.group.today h2 .count { background: var(--mint); color: #0A0A0F; }

  .item { background: var(--card); border: 1px solid var(--border); border-radius: 10px; padding: 12px 14px; margin-bottom: 8px; display: flex; align-items: flex-start; gap: 10px; }
  .item .check { width: 20px; height: 20px; border: 1.5px solid var(--muted); border-radius: 50%; flex-shrink: 0; margin-top: 2px; cursor: pointer; }
  .item .check:hover { border-color: var(--mint); }
  .item-body { flex: 1; min-width: 0; }
  .item-text { font-size: 14px; line-height: 1.4; word-wrap: break-word; }
  .item.done .item-text { text-decoration: line-through; color: var(--muted); }
  .item-meta { display: flex; gap: 8px; align-items: center; margin-top: 4px; flex-wrap: wrap; }
  .item-date { font-size: 11px; color: var(--muted); }
  .item-tag { font-size: 10px; padding: 2px 7px; border-radius: 10px; background: #1c1c26; color: var(--mint); border: 1px solid var(--border); }
  .item-recurring { font-size: 11px; color: var(--gold); }
  .item-actions { display: flex; gap: 6px; flex-shrink: 0; }
  .item-actions button { background: transparent; border: 1px solid var(--border); color: var(--muted); font-size: 11px; padding: 5px 9px; }
  .item-actions button:hover { color: var(--text); border-color: var(--muted); }

  .empty-state { color: var(--muted); font-size: 13px; padding: 20px 0; text-align: center; }
  .footer-actions { display: flex; justify-content: center; gap: 10px; margin-top: 20px; }
  .footer-actions button { background: transparent; border: 1px solid var(--border); color: var(--muted); font-size: 12px; padding: 8px 14px; }
  .footer-actions button:hover { color: var(--text); }

  .modal-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.6); align-items: center; justify-content: center; z-index: 100; padding: 20px; }
  .modal-overlay.open { display: flex; }
  .modal { background: var(--card); border: 1px solid var(--border); border-radius: 16px; padding: 28px; max-width: 420px; width: 100%; }
  .modal h3 { font-size: 18px; margin-bottom: 6px; }
  .modal .modal-sub { color: var(--muted); font-size: 13px; margin-bottom: 20px; }
  .modal ul { list-style: none; margin-bottom: 20px; }
  .modal li { font-size: 13px; padding: 8px 0; border-bottom: 1px solid var(--border); display: flex; align-items: center; gap: 8px; }
  .modal li:last-child { border-bottom: none; }
  .modal li::before { content: "✓"; color: var(--gold); font-weight: 700; }
  .modal .price { font-size: 26px; font-weight: 700; margin-bottom: 4px; }
  .modal .price span { font-size: 13px; color: var(--muted); font-weight: 400; }
  .modal button.cta { width: 100%; background: var(--gold); color: #0A0A0F; font-weight: 700; padding: 13px; font-size: 14px; margin-top: 6px; }
  .modal button.cta:hover { opacity: 0.9; }
  .modal button.cta:disabled { opacity: 0.5; cursor: wait; }
  .modal .close-modal { background: transparent; color: var(--muted); font-size: 12px; width: 100%; padding: 10px; margin-top: 6px; }
  .modal .modal-error { color: var(--danger); font-size: 12px; text-align: center; margin-top: 10px; min-height: 14px; }
</style>
</head>

<div id="auth">
  <div class="auth-box">
    <select id="langSelectAuth" class="lang-switch">
      <option value="fr">FR</option>
      <option value="en">EN</option>
      <option value="es">ES</option>
      <option value="pt">PT</option>
    </select>
    <h1>Resurface</h1>
    <p class="tagline" data-i18n="tagline"></p>
    <div class="auth-error" id="authError"></div>
    <form id="authForm">
      <input type="email" id="email" required autocomplete="username">
      <input type="password" id="password" required autocomplete="current-password">
      <button type="submit" class="btn-primary" id="authSubmit"></button>
    </form>
    <div class="switch-link">
      <span id="switchText"></span>
      <a id="switchLink"></a>
    </div>
  </div>
</div>

<div id="app" class="hidden">
  <header>

    </div>

        <option value="en">EN</option>
        <option value="es">ES</option>
        <option value="pt">PT</option>
      </select>
      <div class="plan-badge free" id="planBadge"></div>
      <button id="logoutBtn"></button>
    </div>
  </header>

  <div id="banner"></div>

  <div class="capture-box">
    <input type="text" id="itemText">
    <div class="capture-row">
      <select id="whenSelect">
        <option value="0" data-i18n="when_today"></option>
        <option value="1" data-i18n="when_tomorrow"></option>
        <option value="7" selected data-i18n="when_1week"></option>
        <option value="14" data-i18n="when_2weeks"></option>
        <option value="30" data-i18n="when_1month"></option>
        <option value="90" data-i18n="when_3months"></option>
        <option value="custom" data-i18n="when_custom"></option>
      </select>
      <input type="date" id="customDate" class="hidden">
      <select id="categorySelect">
        <option value="" data-i18n="cat_none"></option>
        <option value="Client" data-i18n="cat_client"></option>
        <option value="Fournisseur" data-i18n="cat_supplier"></option>
        <option value="Admin" data-i18n="cat_admin"></option>
        <option value="Idée" data-i18n="cat_idea"></option>
      </select>
      <select id="recurringSelect">
        <option value="" data-i18n="rec_none"></option>
        <option value="7" data-i18n="rec_weekly"></option>
        <option value="30" data-i18n="rec_monthly"></option>
      </select>
      <button class="add-btn" id="addBtn"></button>
    </div>
  </div>

  <div class="usage-bar">
    <span id="usageText"></span>
    <span class="upgrade-link" id="upgradeLink"></span>
  </div>

  <section class="group today">
    <h2><span data-i18n="section_today"></span> <span class="count" id="todayCount">0</span></h2>
    <div id="todayList"></div>
  </section>
  <section class="group">
    <h2><span data-i18n="section_upcoming"></span> <span class="count" id="upcomingCount">0</span></h2>
    <div id="upcomingList"></div>
  </section>
  <section class="group">
    <h2><span data-i18n="section_done"></span> <span class="count" id="doneCount">0</span></h2>
    <div id="doneList"></div>
  </section>

  <div class="footer-actions">
    <button id="manageBillingBtn" class="hidden" data-i18n="manage_billing"></button>
  </div>
</div>

<div class="modal-overlay" id="modalOverlay">
  <div class="modal">
    <h3 data-i18n="modal_title"></h3>
    <div class="modal-sub" data-i18n="modal_sub"></div>
    <div class="price">9€ <span data-i18n="modal_per_month"></span></div>
    <ul>
      <li data-i18n="modal_feat1"></li>
      <li data-i18n="modal_feat2"></li>
      <li data-i18n="modal_feat3"></li>
      <li data-i18n="modal_feat4"></li>
    </ul>
    <button class="cta" id="checkoutBtn" data-i18n="modal_cta"></button>
    <button class="close-modal" id="closeModalBtn" data-i18n="modal_close"></button>
    <div class="modal-error" id="modalError"></div>
  </div>
</div>

const SUPPORTED_LOCALES = ['fr', 'en', 'es', 'pt'];

function detectInitialLocale() {
  const stored = localStorage.getItem('resurface_locale');
  if (stored && SUPPORTED_LOCALES.includes(stored)) return stored;
  const nav = (navigator.language || 'fr').slice(0, 2).toLowerCase();
  return SUPPORTED_LOCALES.includes(nav) ? nav : 'fr';
}

let currentLocale = detectInitialLocale();
function t(key) { return (I18N[currentLocale] || I18N.fr)[key]; }

function applyStaticTranslations() {
  document.querySelectorAll('[data-i18n]').forEach(el => {
    const key = el.getAttribute('data-i18n');
    const val = t(key);
    if (typeof val === 'string') el.textContent = val;
  });
  document.getElementById('email').placeholder = t('email_placeholder');
  document.getElementById('password').placeholder = t('password_placeholder');
  authSubmit.textContent = isSignup ? t('signup_submit') : t('login_submit');
  switchText.textContent = isSignup ? t('switch_to_login') : t('switch_to_signup');
  switchLink.textContent = isSignup ? t('switch_to_login_link') : t('switch_to_signup_link');
  document.getElementById('itemText').placeholder = t('item_placeholder');
  document.getElementById('addBtn').textContent = t('add_btn');
  document.getElementById('logoutBtn').textContent = t('logout');
  document.getElementById('upgradeLink').textContent = t('upgrade_link');
  document.documentElement.lang = currentLocale;
  document.getElementById('langSelectAuth').value = currentLocale;
  document.getElementById('langSelect').value = currentLocale;
}

async function setLocale(newLocale, persistToServer) {
  if (!SUPPORTED_LOCALES.includes(newLocale)) return;
  currentLocale = newLocale;
  localStorage.setItem('resurface_locale', newLocale);
  applyStaticTranslations();
  refreshPlanUI();
  if (token) {
    try { await loadItems(); } catch (e) { /* ignore */ }
  }
  if (persistToServer && token) {
    try { await apiFetch(`${API}/me`, { method: 'PATCH', body: JSON.stringify({ locale: newLocale }) }); }
    catch (e) { /* silencieux */ }
  }
}

document.getElementById('langSelectAuth').addEventListener('change', (e) => setLocale(e.target.value, false));
document.getElementById('langSelect').addEventListener('change', (e) => setLocale(e.target.value, true));

// ---------- App state ----------
const API = '/api';
let token = localStorage.getItem('resurface_token');
let isSignup = false;
let isPremium = false;

// ---------- Auth ----------
const authForm = document.getElementById('authForm');
const authError = document.getElementById('authError');
const switchLink = document.getElementById('switchLink');
const switchText = document.getElementById('switchText');
const authSubmit = document.getElementById('authSubmit');

switchLink.addEventListener('click', () => {
  isSignup = !isSignup;
  authError.textContent = '';
  applyStaticTranslations();
});

authForm.addEventListener('submit', async (e) => {
  e.preventDefault();
  authError.textContent = '';
  const email = document.getElementById('email').value.trim();
  const password = document.getElementById('password').value;
  try {
    const res = await fetch(`${API}/${isSignup ? 'signup' : 'login'}`, {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ email, password, locale: currentLocale }),
    });
    const data = await res.json();
    if (!res.ok) { authError.textContent = data.error || t('error_generic'); return; }
    token = data.token;
    localStorage.setItem('resurface_token', token);
    if (data.locale) { currentLocale = data.locale; localStorage.setItem('resurface_locale', data.locale); }
    showApp();
  } catch (err) {
    authError.textContent = t('error_server_unreachable');
  }
});

document.getElementById('logoutBtn').addEventListener('click', () => {
  localStorage.removeItem('resurface_token');
  token = null;
  document.getElementById('app').classList.add('hidden');
  document.getElementById('auth').classList.remove('hidden');
});

function showApp() {
  document.getElementById('auth').classList.add('hidden');
  document.getElementById('app').classList.remove('hidden');
  applyStaticTranslations();
  checkUrlParams();
  refreshMe().then(loadItems);
}

function checkUrlParams() {
  const params = new URLSearchParams(window.location.search);
  const banner = document.getElementById('banner');
  if (params.get('checkout') === 'success') {
    banner.innerHTML = `<div class="banner success">${t('banner_success')}</div>`;
    setTimeout(() => { refreshMe().then(loadItems); }, 2000);
  } else if (params.get('checkout') === 'cancelled') {
    banner.innerHTML = `<div class="banner info">${t('banner_cancelled')}</div>`;
  }
  window.history.replaceState({}, '', window.location.pathname);
}

async function apiFetch(url, opts = {}) {
  const res = await fetch(url, {
    ...opts,
    headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${token}`, ...(opts.headers || {}) },
  });
  if (res.status === 401) {
    localStorage.removeItem('resurface_token');
    token = null;
    document.getElementById('app').classList.add('hidden');
    document.getElementById('auth').classList.remove('hidden');
    throw new Error(t('session_expired'));
  }
  const data = await res.json();
  if (!res.ok) { const e = new Error(data.error || t('error_generic')); e.code = data.code; e.status = res.status; throw e; }
  return data;
}

async function refreshMe() {
  try {
    const me = await apiFetch(`${API}/me`);
    isPremium = me.isPremium;
    if (me.locale && me.locale !== currentLocale) {
      currentLocale = me.locale;
      localStorage.setItem('resurface_locale', me.locale);
      applyStaticTranslations();
    }
    refreshPlanUI();
  } catch (e) { /* silencieux */ }
}

// ---------- Plan / Premium UI ----------
const planBadge = document.getElementById('planBadge');
const categorySelect = document.getElementById('categorySelect');
const recurringSelect = document.getElementById('recurringSelect');
const modalOverlay = document.getElementById('modalOverlay');
const manageBillingBtn = document.getElementById('manageBillingBtn');

function refreshPlanUI() {
  planBadge.textContent = isPremium ? t('plan_premium') : t('plan_free');
  planBadge.className = 'plan-badge ' + (isPremium ? 'premium' : 'free');
  categorySelect.disabled = !isPremium;
  recurringSelect.disabled = !isPremium;
  manageBillingBtn.classList.toggle('hidden', !isPremium);
}

function openModal() { document.getElementById('modalError').textContent = ''; modalOverlay.classList.add('open'); }
function closeModal() { modalOverlay.classList.remove('open'); }

document.getElementById('upgradeLink').addEventListener('click', () => { if (!isPremium) openModal(); });
document.getElementById('closeModalBtn').addEventListener('click', closeModal);
planBadge.addEventListener('click', () => { if (!isPremium) openModal(); });
categorySelect.addEventListener('mousedown', (e) => { if (!isPremium) { e.preventDefault(); openModal(); } });
recurringSelect.addEventListener('mousedown', (e) => { if (!isPremium) { e.preventDefault(); openModal(); } });

document.getElementById('checkoutBtn').addEventListener('click', async () => {
  const btn = document.getElementById('checkoutBtn');
  const errEl = document.getElementById('modalError');
  btn.disabled = true; btn.textContent = t('modal_cta_loading'); errEl.textContent = '';
  try {
    const data = await apiFetch(`${API}/stripe/create-checkout-session`, { method: 'POST' });
    window.location.href = data.url;
  } catch (err) {
    errEl.textContent = err.message;
    btn.disabled = false; btn.textContent = t('modal_cta');
  }
});

manageBillingBtn.addEventListener('click', async () => {
  try {
    const data = await apiFetch(`${API}/stripe/create-portal-session`, { method: 'POST' });
    window.location.href = data.url;
  } catch (err) {
    alert(err.message);
  }
});

// ---------- Capture ----------
const whenSelect = document.getElementById('whenSelect');
const customDate = document.getElementById('customDate');
whenSelect.addEventListener('change', () => {
  customDate.classList.toggle('hidden', whenSelect.value !== 'custom');
});

document.getElementById('addBtn').addEventListener('click', addItem);
document.getElementById('itemText').addEventListener('keydown', (e) => { if (e.key === 'Enter') addItem(); });

async function addItem() {
  const textInput = document.getElementById('itemText');
  const text = textInput.value.trim();
  if (!text) return;

  let resurfaceAt;
  if (whenSelect.value === 'custom') {
    if (!customDate.value) { customDate.focus(); return; }
    resurfaceAt = customDate.value;
  } else {
    const d = new Date();
    d.setDate(d.getDate() + Number(whenSelect.value));
    resurfaceAt = d.toISOString().slice(0, 10);
  }

  try {
    await apiFetch(`${API}/items`, {
      method: 'POST',
      body: JSON.stringify({
        text, resurfaceAt,
        category: isPremium ? categorySelect.value : '',
        recurringDays: isPremium ? recurringSelect.value : '',
      }),
    });
    textInput.value = '';
    loadItems();
  } catch (err) {
    if (err.code === 'LIMIT_REACHED') openModal();
    else alert(err.message);
  }
}

function fmtDate(iso) {
  const d = new Date(iso + 'T00:00:00');
  return d.toLocaleDateString(t('date_locale'), { day: 'numeric', month: 'short', year: 'numeric' });
}
function escapeHtml(str) { const d = document.createElement('div'); d.textContent = str; return d.innerHTML; }

function renderItem(item, context) {
  const div = document.createElement('div');
  div.className = 'item' + (item.status === 'done' ? ' done' : '');

  const check = document.createElement('div');
  check.className = 'check';
  check.style.background = item.status === 'done' ? 'var(--mint)' : 'transparent';
  check.addEventListener('click', () => toggleDone(item));

  const body = document.createElement('div');
  body.className = 'item-body';
  const dateLabel = context === 'done' ? t('date_fait') : t('date_prevu');
  const dateVal = context === 'done' ? item.completedAt.slice(0, 10) : item.resurfaceAt;
  let metaHtml = `<span class="item-date">${dateLabel}${fmtDate(dateVal)}</span>`;
  if (item.category) metaHtml += `<span class="item-tag">${escapeHtml(item.category)}</span>`;
  if (item.recurringDays) metaHtml += `<span class="item-recurring">${t('recurring_badge')}</span>`;
  body.innerHTML = `<div class="item-text">${escapeHtml(item.text)}</div><div class="item-meta">${metaHtml}</div>`;

  const actions = document.createElement('div');
  actions.className = 'item-actions';
  if (context !== 'done') {
    const snoozeBtn = document.createElement('button');
    snoozeBtn.textContent = t('snooze_btn');
    snoozeBtn.addEventListener('click', () => snooze(item.id, 7));
    actions.appendChild(snoozeBtn);
  }
  const delBtn = document.createElement('button');
  delBtn.textContent = '✕';
  delBtn.addEventListener('click', () => deleteItem(item.id));
  actions.appendChild(delBtn);

  div.appendChild(check); div.appendChild(body); div.appendChild(actions);
  return div;
}

async function toggleDone(item) {
  const action = item.status === 'done' ? 'reopen' : 'done';
  await apiFetch(`${API}/items/${item.id}`, { method: 'PATCH', body: JSON.stringify({ action }) });
  loadItems();
}
async function snooze(id, days) {
  await apiFetch(`${API}/items/${id}`, { method: 'PATCH', body: JSON.stringify({ action: 'snooze', days }) });
  loadItems();
}
async function deleteItem(id) {
  await apiFetch(`${API}/items/${id}`, { method: 'DELETE' });
  loadItems();
}

function renderList(listId, countId, items, context) {
  const el = document.getElementById(listId);
  document.getElementById(countId).textContent = items.length;
  el.innerHTML = '';
  if (items.length === 0) {
    const empty = document.createElement('div');
    empty.className = 'empty-state';
    empty.textContent = context === 'today' ? t('empty_today') : context === 'upcoming' ? t('empty_upcoming') : t('empty_done');
    el.appendChild(empty);
    return;
  }
  items.forEach(item => el.appendChild(renderItem(item, context)));
}

async function loadItems() {
  const data = await apiFetch(`${API}/items`);
  isPremium = data.isPremium;
  refreshPlanUI();
  renderList('todayList', 'todayCount', data.today, 'today');
  renderList('upcomingList', 'upcomingCount', data.upcoming, 'upcoming');
  renderList('doneList', 'doneCount', data.done, 'done');

  const activeCount = data.today.length + data.upcoming.length;
  const usageText = document.getElementById('usageText');
  const upgradeLink = document.getElementById('upgradeLink');
  if (isPremium) {
    usageText.textContent = t('usage_premium')(activeCount);
    upgradeLink.style.display = 'none';
  } else {
    usageText.textContent = t('usage_free')(activeCount, data.freeLimit);
    upgradeLink.style.display = 'inline';
  }
}

applyStaticTranslations();
if (token) showApp();
</script>
</body>
</html>
