<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>Resurface — Retrouvez ce qui compte au bon moment</title>
  <meta name="description" content="Capturez une idée, une relance ou une chose à vérifier. Resurface vous la remet sous les yeux automatiquement au bon moment.">
  <meta name="theme-color" content="#081511">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Resurface">
  <meta name="mobile-web-app-capable" content="yes">
  <meta property="og:title" content="Resurface — Retrouvez ce qui compte au bon moment">
  <meta property="og:description" content="Capturez maintenant. Retrouvez au bon moment.">
  <meta property="og:type" content="website">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="icon" sizes="192x192" href="/icons/icon-192.png">
  <link rel="apple-touch-icon" sizes="180x180" href="/icons/icon-180.png">
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <div id="marketing">
    <header class="topbar">
      <div class="container nav">
        <button class="brand brand-button" id="brandHome" aria-label="Resurface home">
          <span class="brand-mark" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none"><path d="M4 14h16M7 14c0-5 2.7-9 5-9s5 4 5 9" stroke="#5ee6b3" stroke-width="2.4" stroke-linecap="round"/></svg></span>
          <span>Resurface</span>
        </button>
        <nav class="nav-links" aria-label="Navigation principale">
          <a href="#how" data-i18n="nav_how"></a>
          <a href="#uses" data-i18n="nav_uses"></a>
          <a href="#pricing" data-i18n="nav_pricing"></a>
        </nav>
        <div class="nav-actions">
          <button class="btn btn-ghost install-trigger hidden" data-i18n="install"></button>
          <select class="select locale-select" aria-label="Language">
            <option value="fr">FR</option><option value="en">EN</option><option value="es">ES</option><option value="pt">PT</option>
          </select>
          <button class="btn btn-ghost" id="loginTop" data-i18n="login"></button>
          <button class="btn btn-primary desktop-cta" id="startTop" data-i18n="try_free"></button>
        </div>
      </div>
    </header>

    <main>
      <section class="container hero">
        <div>
          <span class="eyebrow" data-i18n="eyebrow"></span>
          <h1 data-i18n="hero_title"></h1>
          <p data-i18n="hero_sub"></p>
          <div class="hero-actions">
            <button class="btn btn-primary" id="heroStart" data-i18n="first_reminder"></button>
            <a class="btn btn-linkbox" href="#how" data-i18n="see_how"></a>
          </div>
          <div class="micro" data-i18n="micro"></div>
        </div>
        <div class="demo" aria-label="Aperçu du digest Resurface">
          <div class="demo-top"><span data-i18n="digest_today"></span><span>3</span></div>
          <div class="demo-card"><strong data-i18n="demo_1"></strong><small data-i18n="demo_1_meta"></small><div class="demo-actions"><span class="pill done" data-i18n="done"></span><span class="pill" data-i18n="snooze"></span></div></div>
          <div class="demo-card"><strong data-i18n="demo_2"></strong><small data-i18n="demo_2_meta"></small></div>
          <div class="demo-card"><strong data-i18n="demo_3"></strong><small data-i18n="demo_3_meta"></small></div>
        </div>
      </section>

      <section class="section alt" id="how">
        <div class="container">
          <div class="section-head"><h2 data-i18n="not_todo"></h2><p data-i18n="not_todo_sub"></p></div>
          <div class="grid3">
            <article class="feature"><div class="feature-num">1</div><h3 data-i18n="step1"></h3><p data-i18n="step1p"></p></article>
            <article class="feature"><div class="feature-num">2</div><h3 data-i18n="step2"></h3><p data-i18n="step2p"></p></article>
            <article class="feature"><div class="feature-num">3</div><h3 data-i18n="step3"></h3><p data-i18n="step3p"></p></article>
          </div>
        </div>
      </section>

      <section class="section" id="uses">
        <div class="container">
          <div class="section-head"><h2 data-i18n="uses_title"></h2><p data-i18n="uses_sub"></p></div>
          <div class="grid4">
            <article class="feature"><h3 data-i18n="use1"></h3><p data-i18n="use1p"></p></article>
            <article class="feature"><h3 data-i18n="use2"></h3><p data-i18n="use2p"></p></article>
            <article class="feature"><h3 data-i18n="use3"></h3><p data-i18n="use3p"></p></article>
            <article class="feature"><h3 data-i18n="use4"></h3><p data-i18n="use4p"></p></article>
          </div>
        </div>
      </section>

      <section class="section alt" id="pricing">
        <div class="container">
          <div class="section-head"><h2 data-i18n="pricing_title"></h2><p data-i18n="pricing_sub"></p></div>
          <div class="pricing">
            <article class="price-card">
              <h3 data-i18n="free"></h3>
              <div class="price">0 <small data-i18n="forever"></small></div>
              <ul><li data-i18n="free1"></li><li data-i18n="free2"></li><li data-i18n="free3"></li></ul>
              <button class="btn full" id="freeStart" data-i18n="start_free"></button>
            </article>
            <article class="price-card pro">
              <div class="price-head"><h3>Premium</h3><select id="marketingCurrency" class="select currency-select" aria-label="Currency"></select></div>
              <div class="price" id="marketingPrice"></div>
              <ul><li data-i18n="pro1"></li><li data-i18n="pro2"></li><li data-i18n="pro3"></li><li data-i18n="pro4"></li></ul>
              <button class="btn btn-primary full" id="proStart" data-i18n="try_free"></button>
            </article>
          </div>
        </div>
      </section>

      <section class="section"><div class="container cta-band"><h2 data-i18n="cta_title"></h2><p data-i18n="cta_sub"></p><button class="btn btn-primary" id="ctaStart" data-i18n="try_resurface"></button></div></section>
    </main>

    <footer class="footer"><div class="container footer-inner"><span>© 2026 Resurface — <span data-i18n="signature"></span></span><div><a href="mailto:support@resurface.app" data-i18n="contact"></a><a href="#" data-legal="privacy" data-i18n="privacy"></a><a href="#" data-legal="terms" data-i18n="terms"></a></div></div></footer>
  </div>

  <div id="appShell" class="hidden">
    <div class="app-wrap">
      <header class="app-head">
        <button class="brand brand-button" id="appBrand">
          <span class="brand-mark"><svg viewBox="0 0 24 24" fill="none"><path d="M4 14h16M7 14c0-5 2.7-9 5-9s5 4 5 9" stroke="#5ee6b3" stroke-width="2.4" stroke-linecap="round"/></svg></span>
          <span><strong>Resurface</strong><small data-i18n="signature"></small></span>
        </button>
        <div class="app-actions">
          <span class="badge" id="planBadge"></span>
          <button class="btn install-trigger hidden" data-i18n="install"></button>
          <select class="select locale-select" aria-label="Language"><option value="fr">FR</option><option value="en">EN</option><option value="es">ES</option><option value="pt">PT</option></select>
          <button class="btn icon-btn" id="settingsBtn" aria-label="Settings">⚙</button>
          <button class="btn hidden" id="billingBtn" data-i18n="billing"></button>
          <button class="btn" id="logoutBtn" data-i18n="logout"></button>
        </div>
      </header>

      <div id="checkoutBanner" class="notice hidden"></div>

      <section class="capture">
        <label for="itemText" data-i18n="capture_label"></label>
        <div class="capture-main"><input id="itemText" type="text" maxlength="500"><button class="btn btn-primary" id="addBtn" data-i18n="schedule"></button></div>
        <div class="quick-dates">
          <button class="quick" data-days="1" data-i18n="tomorrow"></button>
          <button class="quick active" data-days="7" data-i18n="next_week"></button>
          <button class="quick" data-days="14" data-i18n="two_weeks"></button>
          <button class="quick" data-days="30" data-i18n="one_month"></button>
          <button class="quick" data-days="custom" data-i18n="choose_date"></button>
        </div>
        <div class="advanced">
          <label class="compact-field"><span data-i18n="date"></span><input id="customDate" type="date"></label>
          <label class="compact-field"><span data-i18n="time"></span><input id="customTime" type="time" value="09:00"></label>
          <label class="compact-field wide"><span data-i18n="category"></span><select id="category"></select></label>
          <label class="compact-field wide"><span data-i18n="recurrence"></span><select id="recurring"></select></label>
          <label class="compact-field hidden" id="recurrenceIntervalWrap"><span data-i18n="every_days"></span><input id="recurrenceInterval" type="number" min="1" max="3650" value="10"></label>
        </div>
        <div class="option-help"><span id="categoryHelp"></span><span id="recurrenceHelp"></span></div>
        <div class="timezone-line"><span id="timezoneHint"></span><button id="openSettingsLink" data-i18n="change"></button></div>
      </section>

      <div id="notificationNudge" class="notification-nudge hidden" role="region" aria-live="polite">
        <div><strong data-i18n="push_nudge_title"></strong><p data-i18n="push_nudge_body"></p><small id="notificationNudgeStatus"></small></div>
        <button class="btn btn-primary" id="enableNotificationsBtn" data-i18n="enable_notifications"></button>
      </div>

      <div class="usage"><span id="usage"></span><button id="upgradeBtn" data-i18n="upgrade"></button></div>

      <div class="app-grid">
        <section class="panel"><h2><span data-i18n="today"></span><span class="count" id="todayCount">0</span></h2><div id="todayList"></div></section>
        <section class="panel"><h2><span data-i18n="upcoming"></span><span class="count" id="upcomingCount">0</span></h2><div id="upcomingList"></div></section>
        <section class="panel full"><h2><span data-i18n="completed"></span><span class="count" id="doneCount">0</span></h2><div id="doneList"></div></section>
      </div>
    </div>
  </div>

  <div class="overlay" id="authOverlay" role="dialog" aria-modal="true">
    <div class="dialog"><button class="close" data-close="authOverlay" aria-label="Close">×</button><h2 id="authTitle"></h2><p data-i18n="auth_sub"></p>
      <form id="authForm"><div class="field"><label for="email" data-i18n="email"></label><input id="email" type="email" autocomplete="email" required></div><div class="field"><label for="password" data-i18n="password"></label><input id="password" type="password" minlength="8" required></div><div class="error" id="authError"></div><button class="btn btn-primary full tall" id="authSubmit"></button></form>
      <div class="switch"><span id="switchText"></span> <button id="switchMode"></button></div>
    </div>
  </div>

  <div class="overlay" id="payOverlay" role="dialog" aria-modal="true">
    <div class="dialog paybox"><button class="close" data-close="payOverlay">×</button><h2 data-i18n="premium_title"></h2><p data-i18n="premium_sub"></p>
      <div class="currency-row"><label for="currency" data-i18n="currency"></label><select id="currency" class="select currency-select"></select></div>
      <div class="price" id="modalPrice"></div><div class="availability" id="currencyAvailability"></div>
      <ul><li data-i18n="pro1"></li><li data-i18n="pro2"></li><li data-i18n="pro3"></li><li data-i18n="pro4"></li></ul>
      <div class="error" id="payError"></div><button class="btn btn-primary full tall" id="checkout" data-i18n="continue_payment"></button>
    </div>
  </div>

  <div class="overlay" id="settingsOverlay" role="dialog" aria-modal="true">
    <div class="dialog dialog-wide"><button class="close" data-close="settingsOverlay">×</button><h2 data-i18n="settings"></h2><p data-i18n="settings_sub"></p>
      <form id="settingsForm">
        <div class="settings-grid">
          <div class="field"><label for="country" data-i18n="country"></label><select id="country"></select><small data-i18n="country_help"></small></div>
          <div class="field"><label for="settingsCurrency" data-i18n="currency"></label><select id="settingsCurrency"></select><small data-i18n="currency_help"></small></div>
          <div class="field full-grid"><label for="timezone" data-i18n="timezone"></label><select id="timezone"></select><small id="deviceTimezone"></small></div>
          <div class="field"><label for="digestTime" data-i18n="digest_time"></label><input id="digestTime" type="time" value="08:00"></div>
          <div class="field"><label for="digestEnabled" data-i18n="email_digest"></label><select id="digestEnabled"><option value="true" data-i18n="enabled"></option><option value="false" data-i18n="disabled"></option></select><small data-i18n="premium_digest_note"></small></div>
        </div>
        <div class="settings-actions"><button type="button" class="btn" id="useDeviceBtn" data-i18n="use_device"></button><button type="button" class="btn" id="gpsBtn" data-i18n="check_gps"></button></div><div class="gps-result" id="gpsResult"></div>
        <section class="push-settings" aria-labelledby="pushSettingsTitle">
          <div class="push-settings-head"><div><h3 id="pushSettingsTitle" data-i18n="push_settings_title"></h3><p data-i18n="push_settings_body"></p></div><span class="push-status" id="pushStatusBadge"></span></div>
          <div id="iosPushInstructions" class="ios-instructions hidden"><strong data-i18n="ios_push_title"></strong><ol><li data-i18n="ios_push_step1"></li><li data-i18n="ios_push_step2"></li><li data-i18n="ios_push_step3"></li></ol></div>
          <div class="settings-actions">
            <button type="button" class="btn btn-primary" id="settingsEnableNotifications" data-i18n="enable_notifications"></button>
            <button type="button" class="btn hidden" id="disableNotificationsBtn" data-i18n="disable_notifications"></button>
            <button type="button" class="btn" id="testNotificationBtn" data-i18n="send_test_notification"></button>
          </div>
          <div class="push-test-tools"><span data-i18n="quick_push_test"></span><button type="button" class="quick" id="schedule1MinBtn" data-i18n="in_one_minute"></button><button type="button" class="quick" id="schedule2MinBtn" data-i18n="in_two_minutes"></button></div>
          <div id="pushSettingsMessage" class="gps-result"></div>
        </section>
        <div class="error" id="settingsError"></div><button class="btn btn-primary full tall" type="submit" data-i18n="save_settings"></button>
      </form>
    </div>
  </div>

  <div class="overlay" id="snoozeOverlay" role="dialog" aria-modal="true"><div class="dialog"><button class="close" data-close="snoozeOverlay">×</button><h2 data-i18n="snooze_title"></h2><p data-i18n="snooze_sub"></p><form id="snoozeForm"><div class="two-fields"><div class="field"><label data-i18n="date"></label><input id="snoozeDate" type="date" required></div><div class="field"><label data-i18n="time"></label><input id="snoozeTime" type="time" required></div></div><button class="btn btn-primary full tall" data-i18n="snooze"></button></form></div></div>

  <div class="overlay" id="editOverlay" role="dialog" aria-modal="true"><div class="dialog dialog-wide"><button class="close" data-close="editOverlay">×</button><h2 data-i18n="edit_title"></h2><form id="editForm"><div class="field"><label data-i18n="capture_label"></label><input id="editText" maxlength="500" required></div><div class="two-fields"><div class="field"><label data-i18n="date"></label><input id="editDate" type="date" required></div><div class="field"><label data-i18n="time"></label><input id="editTime" type="time" required></div></div><div class="two-fields"><div class="field"><label data-i18n="category"></label><select id="editCategory"></select><small id="editCategoryHelp"></small></div><div class="field"><label data-i18n="recurrence"></label><select id="editRecurring"></select><small id="editRecurrenceHelp"></small></div></div><div class="field hidden" id="editRecurrenceIntervalWrap"><label data-i18n="every_days"></label><input id="editRecurrenceInterval" type="number" min="1" max="3650"></div><button class="btn btn-primary full tall" data-i18n="save"></button></form></div></div>

  <div class="overlay" id="itemDetailOverlay" role="dialog" aria-modal="true" aria-labelledby="itemDetailTitle">
    <div class="dialog item-detail-dialog"><button class="close" data-close="itemDetailOverlay">×</button><span class="eyebrow" data-i18n="resurfacing_now"></span><h2 id="itemDetailTitle"></h2><p id="itemDetailMeta"></p>
      <div class="detail-actions">
        <button class="btn btn-primary" id="detailDoneBtn" data-i18n="done"></button>
        <button class="btn" id="detailAgainBtn" data-i18n="resurface_again"></button>
        <button class="btn" id="detailTomorrowBtn" data-i18n="tomorrow"></button>
        <button class="btn" id="detailNextWeekBtn" data-i18n="next_week"></button>
        <button class="btn btn-danger" id="detailArchiveBtn" data-i18n="archive"></button>
      </div>
    </div>
  </div>

  <div class="overlay" id="legalOverlay" role="dialog" aria-modal="true"><div class="dialog"><button class="close" data-close="legalOverlay">×</button><h2 id="legalTitle"></h2><div id="legalBody" class="legal-body"></div></div></div>
  <div class="toast hidden" id="toast" role="status"></div>

  <script src="/app.js" defer></script>
</body>
</html>
